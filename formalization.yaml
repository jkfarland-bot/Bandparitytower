      module: "Challenge"
      status: "proved"
      note: "Classical input, formalized; its case k = 2 is the criterion of Williams and Currie."
    - source: "Theorem 4.1, the power-map family"
      lean: "BandParityTower.power_map_family"
      module: "Challenge"
      status: "proved"
    - source: "Theorem 4.9, the companion law at p = 1 (mod 8)"
      lean: "BandParityTower.companion_law_one_mod_eight"
      module: "Challenge"
      status: "proved"
    - source: "Theorem 4.11, Lehmer-type invariants"
      lean: "BandParityTower.lehmer_invariants"
      module: "Challenge"
      status: "proved"
    - source: "Corollary 5.1, the joint-parity form"
      lean: "BandParityTower.joint_parity_form"
      module: "Challenge"
      status: "proved"
    - source: "Lemma 5.2"
      lean: "BandParityTower.hminus_mod_eight"
      module: "Challenge"
      status: "proved"
    - source: "Proposition 5.3, the mod-8 dichotomy"
      lean: "BandParityTower.mod_eight_dichotomy"
      module: "Challenge"
      status: "proved"
    - source: "Proposition 5.6 (1), squaring cycles"
      lean: "BandParityTower.squaring_cycles"
      module: "Challenge"
      status: "proved"
      note: "Stated for any finite set on which squaring is a bijection."
    - source: "Proposition 5.6 (2), the cycle of a cube root of unity"
      lean: "BandParityTower.cube_root_cycle"
      module: "Challenge"
      status: "proved"
    - source: "Section 5.3, e as a cross-correlation over H"
      lean: "BandParityTower.e_as_correlation"

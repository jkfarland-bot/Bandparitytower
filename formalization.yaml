      lean: "BandParityTower.Ha_spec"
      module: "Challenge"
      status: "proved"
    - source: "Theorem 4.3, the cyclotomic tower"
      lean: "BandParityTower.cyclotomic_tower"
      module: "Challenge"
      status: "proved"
      note: "Values in any commutative ring with chi(g)^(2^(a-1)) = -1; the basis property of 1, zeta, ... is not formalized."
    - source: "Corollary 4.4, the band-parity tower"
      lean: "BandParityTower.band_parity_tower"
      module: "Challenge"
      status: "proved"
    - source: "Proposition 3.5 at c = 2, the doubling count"
      lean: "BandParityTower.doubling_count"
      module: "Challenge"
      status: "proved"
      note: "Proved by a direct count; the character expansion of Proposition 3.5 for general c is not formalized."
    - source: "Theorem 4.5, the imaginary coordinate at every level"
      lean: "BandParityTower.imaginary_law"
      module: "Challenge"
      status: "proved"
    - source: "Corollary 4.6, the level a = 3"
      lean: "BandParityTower.imaginary_law_three"
      module: "Challenge"
      status: "proved"
    - source: "Corollary 4.7, the collapse"
      lean: "BandParityTower.collapse_criterion"
      module: "Challenge"
      status: "proved"
    - source: "Remark 4.8; E. Lehmer (1977), Theorem 5"
